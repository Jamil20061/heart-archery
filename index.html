<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Heart Archery</title>

<link rel="manifest"
      href="manifest.json">

<meta name="theme-color"
      content="#87ceeb">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">


<style>

/* ==================================================
   RESET
================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background:#111;

}

body{

    touch-action:none;

}


/* ==================================================
   GAME
================================================== */

.game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #62bde7 0%,
            #a8dcf0 42%,
            #e8c994 43%,
            #c99555 100%
        );

}


/* ==================================================
   SKY
================================================== */

.sky{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;

}


/* Sun */

.sun{

    position:absolute;

    width:85px;
    height:85px;

    border-radius:50%;

    right:12%;
    top:9%;

    background:
        radial-gradient(
            circle,
            #fff6bd,
            #ffd978 55%,
            rgba(255,210,100,.1) 72%,
            transparent 75%
        );

    filter:
        blur(.5px);

    opacity:.9;

}


/* Clouds */

.cloud{

    position:absolute;

    width:130px;
    height:30px;

    border-radius:50px;

    background:
        rgba(255,255,255,.58);

    filter:blur(4px);

    opacity:.65;

    animation:
        cloudMove
        linear
        infinite;

}

.cloud::before,
.cloud::after{

    content:"";

    position:absolute;

    border-radius:50%;

    background:
        rgba(255,255,255,.62);

}

.cloud::before{

    width:55px;
    height:55px;

    left:20px;
    top:-25px;

}

.cloud::after{

    width:75px;
    height:65px;

    left:65px;
    top:-35px;

}


.cloud.one{

    top:14%;
    left:-180px;

    animation-duration:48s;

}

.cloud.two{

    top:27%;
    left:-220px;

    transform:scale(.7);

    animation-duration:65s;

    animation-delay:-25s;

}

@keyframes cloudMove{

    from{
        transform:
            translateX(0);
    }

    to{
        transform:
            translateX(
                calc(100vw + 450px)
            );
    }

}


/* ==================================================
   DISTANT MOUNTAINS
================================================== */

.mountains{

    position:absolute;

    left:0;
    right:0;

    bottom:38%;

    height:28%;

    background:

        linear-gradient(
            135deg,
            transparent 49%,
            #c9b49a 50%
        ) 0 100% / 24% 100% no-repeat,

        linear-gradient(
            225deg,
            transparent 49%,
            #bca68e 50%
        ) 12% 100% / 27% 100% no-repeat,

        linear-gradient(
            135deg,
            transparent 49%,
            #d4c0a0 50%
        ) 31% 100% / 28% 100% no-repeat,

        linear-gradient(
            225deg,
            transparent 49%,
            #ad9985 50%
        ) 48% 100% / 30% 100% no-repeat,

        linear-gradient(
            135deg,
            transparent 49%,
            #c7af91 50%
        ) 68% 100% / 31% 100% no-repeat,

        linear-gradient(
            225deg,
            transparent 49%,
            #a99683 50%
        ) 82% 100% / 25% 100% no-repeat;

    opacity:.9;

}


/* ==================================================
   FAR LAND
================================================== */

.far-land{

    position:absolute;

    left:0;
    right:0;

    bottom:25%;

    height:25%;

    background:

        linear-gradient(
            155deg,
            transparent 48%,
            #e5c993 49%
        ) 0 0 / 32% 100% no-repeat,

        linear-gradient(
            205deg,
            transparent 48%,
            #d7b678 49%
        ) 25% 0 / 35% 100% no-repeat,

        linear-gradient(
            160deg,
            transparent 48%,
            #e8cc96 49%
        ) 55% 0 / 30% 100% no-repeat,

        linear-gradient(
            200deg,
            transparent 48%,
            #cfa968 49%
        ) 75% 0 / 35% 100% no-repeat;

}


/* ==================================================
   RIVER
================================================== */

.river{

    position:absolute;

    left:34%;

    bottom:-4%;

    width:58%;

    height:29%;

    transform:
        rotate(-3deg);

    background:
        linear-gradient(
            175deg,
            #7dc7d5,
            #b9e2df 45%,
            #6faeb6
        );

    clip-path:
        polygon(
            0 45%,
            13% 38%,
            30% 42%,
            44% 29%,
            58% 34%,
            73% 19%,
            100% 10%,
            100% 100%,
            0 100%
        );

    opacity:.9;

}


/* river shine */

.river::after{

    content:"";

    position:absolute;

    left:10%;
    top:35%;

    width:65%;
    height:3px;

    background:
        rgba(255,255,255,.45);

    box-shadow:
        60px 20px rgba(255,255,255,.35),
        140px -15px rgba(255,255,255,.25),
        220px 28px rgba(255,255,255,.3);

}


/* ==================================================
   DESERT
================================================== */

.desert{

    position:absolute;

    left:0;
    right:0;

    bottom:0;

    height:47%;

    background:

        radial-gradient(
            ellipse at 20% 70%,
            #e9c77f 0 20%,
            transparent 21%
        ),

        radial-gradient(
            ellipse at 70% 65%,
            #d8ae65 0 23%,
            transparent 24%
        ),

        linear-gradient(
            to bottom,
            #d8b16c,
            #a9703d
        );

}


/* sand waves */

.dune{

    position:absolute;

    border-radius:50%;

    background:
        rgba(255,224,150,.35);

    filter:blur(1px);

}

.dune.one{

    width:55%;
    height:90px;

    left:-10%;
    bottom:24%;

}

.dune.two{

    width:50%;
    height:80px;

    right:-8%;
    bottom:31%;

    background:
        rgba(164,103,52,.35);

}

.dune.three{

    width:45%;
    height:70px;

    left:25%;
    bottom:6%;

    background:
        rgba(255,211,125,.3);

}


/* ==================================================
   ROCKS
================================================== */

.rock{

    position:absolute;

    background:
        linear-gradient(
            135deg,
            #b98c52,
            #805632
        );

    clip-path:
        polygon(
            5% 100%,
            18% 30%,
            48% 10%,
            75% 35%,
            100% 100%
        );

}

.rock.one{

    width:75px;
    height:60px;

    left:10%;
    bottom:13%;

}

.rock.two{

    width:95px;
    height:65px;

    right:18%;
    bottom:18%;

}

.rock.three{

    width:55px;
    height:48px;

    right:5%;
    bottom:11%;

}


/* ==================================================
   UI
================================================== */

.ui{

    position:absolute;

    left:0;
    right:0;

    top:0;

    z-index:50;

    display:flex;

    justify-content:
        space-between;

    align-items:flex-start;

    padding:
        12px
        22px;

    pointer-events:none;

}

.scoreBox{

    color:#1b160f;

    text-shadow:
        0 1px 0
        rgba(255,255,255,.6);

}

.scoreBox small{

    display:block;

    font-size:
        clamp(
            9px,
            1.8vw,
            15px
        );

    letter-spacing:1px;

}

.scoreBox strong{

    display:block;

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(
            22px,
            4vw,
            38px
        );

    font-weight:
        normal;

}


/* ==================================================
   TARGET
================================================== */

.target{

    position:absolute;

    z-index:20;

    width:
        clamp(
            100px,
            17vw,
            175px
        );

    aspect-ratio:1;

    right:13%;

    top:25%;

}


/* ropes */

.rope{

    position:absolute;

    width:3px;

    height:95px;

    top:-75px;

    background:
        linear-gradient(
            to bottom,
            #8b683f,
            #c69a5b
        );

}

.rope.left{

    left:31%;

}

.rope.right{

    right:31%;

}


/* target board */

.board{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ff4030 0 12%,
            #ffd53d 12% 25%,
            #168bd2 25% 40%,
            #ed3434 40% 58%,
            #f5f0dd 58% 100%
        );

    border:
        6px solid
        #725136;

    box-shadow:

        0 7px 10px
        rgba(0,0,0,.4),

        inset 0 0 0 3px
        rgba(255,255,255,.6),

        0 15px 25px
        rgba(0,0,0,.25);

}


/* target center */

.centerDot{

    position:absolute;

    width:13%;

    aspect-ratio:1;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    border:
        2px solid
        white;

    background:
        #ff3c2f;

    box-shadow:
        0 0 8px
        rgba(255,0,0,.7);

}


/* ==================================================
   BOW
================================================== */

.bow{

    position:absolute;

    z-index:25;

    left:13%;

    bottom:17%;

    width:
        clamp(
            90px,
            14vw,
            145px
        );

    height:
        clamp(
            180px,
            28vw,
            250px
        );

    transform:
        rotate(-4deg);

}


/* bow wood */

.bowWood{

    position:absolute;

    left:45%;

    top:0;

    width:16px;

    height:100%;

    border-radius:50%;

    border-left:
        8px solid
        #7b421f;

    border-right:
        4px solid
        #b56a2c;

    transform:
        rotate(8deg);

}


/* bow string */

.bowString{

    position:absolute;

    left:51%;

    top:1%;

    width:2px;

    height:98%;

    background:
        rgba(40,30,20,.8);

}


/* handle */

.bowHandle{

    position:absolute;

    left:37%;

    top:44%;

    width:32px;

    height:65px;

    border-radius:8px;

    background:
        linear-gradient(
            to right,
            #5c2d16,
            #a8612b,
            #572810
        );

}


/* ==================================================
   ARROW
================================================== */

.arrow{

    position:absolute;

    z-index:40;

    width:
        clamp(
            115px,
            18vw,
            180px
        );

    height:12px;

    transform-origin:
        12px 50%;

    user-select:none;

    touch-action:none;

    cursor:
        grab;

    filter:
        drop-shadow(
            0 3px 3px
            rgba(0,0,0,.4)
        );

}

.arrow.dragging{

    cursor:
        grabbing;

}


/* shaft */

.arrowShaft{

    position:absolute;

    left:10px;

    top:5px;

    width:calc(100% - 20px);

    height:4px;

    background:
        linear-gradient(
            to bottom,
            #d9b078,
            #704322
        );

    border-radius:4px;

}


/* arrow head */

.arrowHead{

    position:absolute;

    right:0;

    top:1px;

    width:0;
    height:0;

    border-top:
        5px solid transparent;

    border-bottom:
        5px solid transparent;

    border-left:
        18px solid
        #c8c8c8;

    filter:
        drop-shadow(
            0 1px 1px
            rgba(0,0,0,.6)
        );

}


/* feathers */

.feather{

    position:absolute;

    left:3px;

    width:24px;

    height:8px;

    background:
        #9b4c25;

    clip-path:
        polygon(
            0 100%,
            100% 0,
            75% 100%
        );

}

.feather.top{

    top:-2px;

}

.feather.bottom{

    top:6px;

    transform:
        scaleY(-1);

}


/* ==================================================
   AIM LINE
================================================== */

.aimLine{

    position:absolute;

    height:2px;

    z-index:18;

    transform-origin:
        left center;

    border-top:
        2px dashed
        rgba(40,30,20,.4);

    pointer-events:none;

    display:none;

}


/* ==================================================
   HIT EFFECT
================================================== */

.hit{

    position:absolute;

    z-index:45;

    width:60px;

    height:60px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.9);

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:0;

    pointer-events:none;

}

.hit.active{

    animation:
        hitEffect
        .65s
        ease-out
        forwards;

}

@keyframes hitEffect{

    0%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.2);

    }

    70%{

        opacity:.8;

        transform:
            translate(-50%,-50%)
            scale(1.5);

    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(2);

    }

}


/* ==================================================
   SCORE POP
================================================== */

.scorePop{

    position:absolute;

    z-index:60;

    color:#fff;

    font-family:
        Arial,
        sans-serif;

    font-weight:bold;

    font-size:28px;

    text-shadow:
        0 2px 4px
        rgba(0,0,0,.8);

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    opacity:0;

}

.scorePop.show{

    animation:
        scoreUp
        1s
        ease-out
        forwards;

}

@keyframes scoreUp{

    0%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.6);

    }

    100%{

        opacity:0;

        transform:
            translate(-50%,-130%)
            scale(1.2);

    }

}


/* ==================================================
   PAUSE
================================================== */

.pauseBtn{

    position:absolute;

    right:18px;

    bottom:15px;

    z-index:80;

    width:40px;
    height:40px;

    border-radius:50%;

    border:
        2px solid
        #21180f;

    background:
        rgba(255,245,215,.65);

    color:#1d150e;

    font-size:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

}


/* ==================================================
   PAUSE SCREEN
================================================== */

.pauseScreen{

    position:absolute;

    inset:0;

    z-index:100;

    background:
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(5px);

    display:none;

    align-items:center;

    justify-content:center;

}

.pauseCard{

    padding:
        25px 40px;

    border-radius:20px;

    background:
        rgba(40,25,15,.9);

    border:
        1px solid
        rgba(255,220,170,.4);

    color:white;

    text-align:center;

}

.pauseCard h2{

    margin-bottom:15px;

}

.resumeBtn{

    border:0;

    padding:
        10px 25px;

    border-radius:20px;

    background:
        #d69a4b;

    color:#24150a;

    font-weight:bold;

}


/* ==================================================
   GAME OVER
================================================== */

.gameOver{

    position:absolute;

    inset:0;

    z-index:120;

    display:none;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(7px);

}

.resultCard{

    width:min(90%,380px);

    padding:30px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #38200f,
            #17100a
        );

    border:
        1px solid
        rgba(255,210,130,.4);

    text-align:center;

    color:white;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.6);

}

.resultCard h1{

    font-size:27px;

    margin-bottom:8px;

}

.finalScore{

    font-family:
        Arial,
        sans-serif;

    font-size:65px;

    font-weight:bold;

    color:#ffd15a;

    text-shadow:
        0 0 20px
        rgba(255,190,60,.7);

    margin:10px 0;

}

.playAgain{

    border:0;

    padding:
        12px 30px;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #e2a34e,
            #f0c16c
        );

    color:#2b1708;

    font-weight:bold;

    cursor:pointer;

}


/* ==================================================
   LANDSCAPE MOBILE
================================================== */

@media(
    orientation:portrait
){

    .game::after{

        content:
            "↻ Rotate your phone";

        position:absolute;

        inset:0;

        z-index:200;

        display:flex;

        align-items:center;

        justify-content:center;

        background:
            #17100a;

        color:#ffe2a5;

        font-family:Arial,sans-serif;

        font-size:20px;

        letter-spacing:1px;

    }

}


/* ==================================================
   SMALL SCREEN LANDSCAPE
================================================== */

@media(
    max-height:500px
){

    .target{

        top:23%;

        right:12%;

    }

    .bow{

        bottom:10%;

    }

    .ui{

        padding:
            8px 18px;

    }

}

</style>

</head>


<body>


<div class="game">


    <!-- =============================
         SKY
    ============================== -->

    <div class="sky">

        <div class="sun"></div>

        <div class="cloud one"></div>

        <div class="cloud two"></div>

    </div>


    <!-- =============================
         ENVIRONMENT
    ============================== -->

    <div class="mountains"></div>

    <div class="far-land"></div>

    <div class="river"></div>

    <div class="desert"></div>

    <div class="dune one"></div>

    <div class="dune two"></div>

    <div class="dune three"></div>

    <div class="rock one"></div>

    <div class="rock two"></div>

    <div class="rock three"></div>


    <!-- =============================
         UI
    ============================== -->

    <div class="ui">

        <div class="scoreBox">

            <small>ARROWS</small>

            <strong id="arrows">
                10
            </strong>

        </div>


        <div class="scoreBox"
             style="text-align:right;">

            <small>SCORE</small>

            <strong id="score">
                0
            </strong>

        </div>

    </div>


    <!-- =============================
         TARGET
    ============================== -->

    <div
        class="target"
        id="target"
    >

        <div class="rope left"></div>

        <div class="rope right"></div>

        <div class="board">

            <div class="centerDot"></div>

        </div>

    </div>


    <!-- =============================
         BOW
    ============================== -->

    <div class="bow">

        <div class="bowWood"></div>

        <div class="bowString"></div>

        <div class="bowHandle"></div>

    </div>


    <!-- =============================
         AIM LINE
    ============================== -->

    <div
        class="aimLine"
        id="aimLine">
    </div>


    <!-- =============================
         ARROW
    ============================== -->

    <div
        class="arrow"
        id="arrow"
    >

        <div class="arrowShaft"></div>

        <div class="arrowHead"></div>

        <div class="feather top"></div>

        <div class="feather bottom"></div>

    </div>


    <!-- =============================
         EFFECTS
    ============================== -->

    <div
        class="hit"
        id="hit">
    </div>

    <div
        class="scorePop"
        id="scorePop">
    </div>


    <!-- =============================
         PAUSE
    ============================== -->

    <button
        class="pauseBtn"
        id="pauseBtn">

        ⏸

    </button>


    <div
        class="pauseScreen"
        id="pauseScreen">

        <div class="pauseCard">

            <h2>GAME PAUSED</h2>

            <button
                class="resumeBtn"
                id="resumeBtn">

                RESUME

            </button>

        </div>

    </div>


    <!-- =============================
         GAME OVER
    ============================== -->

    <div
        class="gameOver"
        id="gameOver">

        <div class="resultCard">

            <h1>
                🏹 GAME COMPLETE
            </h1>

            <p>
                Your Final Score
            </p>

            <div
                class="finalScore"
                id="finalScore">

                0

            </div>

            <p>
                Maximum Score: 100
            </p>

            <br>

            <button
                class="playAgain"
                id="playAgain">

                PLAY AGAIN

            </button>

        </div>

    </div>


</div>



<script>

/* ==================================================
   ELEMENTS
================================================== */

const arrow =
    document.getElementById(
        "arrow"
    );

const target =
    document.getElementById(
        "target"
    );

const arrowsText =
    document.getElementById(
        "arrows"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const aimLine =
    document.getElementById(
        "aimLine"
    );

const hit =
    document.getElementById(
        "hit"
    );

const scorePop =
    document.getElementById(
        "scorePop"
    );

const pauseBtn =
    document.getElementById(
        "pauseBtn"
    );

const pauseScreen =
    document.getElementById(
        "pauseScreen"
    );

const resumeBtn =
    document.getElementById(
        "resumeBtn"
    );

const gameOver =
    document.getElementById(
        "gameOver"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const playAgain =
    document.getElementById(
        "playAgain"
    );


/* ==================================================
   GAME VARIABLES
================================================== */

let arrowsLeft = 10;

let score = 0;

let dragging = false;

let flying = false;

let paused = false;

let arrowX = 0;

let arrowY = 0;

let originalX = 0;

let originalY = 0;

let currentX = 0;

let currentY = 0;

let velocityX = 0;

let velocityY = 0;

let dragStartX = 0;

let dragStartY = 0;

let lastTime = 0;


/* ==================================================
   PLACE ARROW
================================================== */

function placeArrow(){

    if(flying)
        return;


    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    originalX =
        w * .17;

    originalY =
        h * .68;


    arrowX =
        originalX;

    arrowY =
        originalY;


    arrow.style.left =
        arrowX + "px";

    arrow.style.top =
        arrowY + "px";

    arrow.style.transform =
        "rotate(0deg)";

    arrow.style.opacity =
        "1";

}


/* ==================================================
   INITIAL
================================================== */

placeArrow();


/* ==================================================
   POINTER DOWN
================================================== */

arrow.addEventListener(
    "pointerdown",
    e => {

        if(
            flying ||
            paused ||
            arrowsLeft <= 0
        )
            return;


        e.preventDefault();


        dragging = true;


        dragStartX =
            e.clientX;

        dragStartY =
            e.clientY;


        currentX =
            arrowX;

        currentY =
            arrowY;


        arrow.classList.add(
            "dragging"
        );


        arrow.setPointerCapture(
            e.pointerId
        );

    }
);


/* ==================================================
   POINTER MOVE
================================================== */

arrow.addEventListener(
    "pointermove",
    e => {

        if(!dragging)
            return;


        e.preventDefault();


        let dx =
            e.clientX -
            dragStartX;

        let dy =
            e.clientY -
            dragStartY;


        /*
          Allow pulling
          mostly backward/downward.
        */

        dx =
            Math.min(
                Math.max(dx,-140),
                30
            );

        dy =
            Math.min(
                Math.max(dy,-90),
                130
            );


        currentX =
            originalX + dx;

        currentY =
            originalY + dy;


        /*
          Shooting direction
        */

        const shootX =
            originalX -
            currentX;

        const shootY =
            originalY -
            currentY;


        const angle =
            Math.atan2(
                shootY,
                shootX
            );


        arrow.style.left =
            currentX + "px";

        arrow.style.top =
            currentY + "px";


        arrow.style.transform =
            `rotate(${angle}rad)`;


        /*
          Aim guide
        */

        const power =
            Math.min(
                Math.sqrt(
                    shootX*shootX +
                    shootY*shootY
                ) / 80,
                1
            );


        const length =
            130 +
            power * 180;


        aimLine.style.display =
            "block";

        aimLine.style.left =
            originalX + 20 + "px";

        aimLine.style.top =
            originalY + 6 + "px";

        aimLine.style.width =
            length + "px";

        aimLine.style.transform =
            `rotate(${angle}rad)`;

    }
);


/* ==================================================
   POINTER UP
================================================== */

arrow.addEventListener(
    "pointerup",
    e => {

        if(!dragging)
            return;


        dragging = false;


        arrow.classList.remove(
            "dragging"
        );


        aimLine.style.display =
            "none";


        const dx =
            originalX -
            currentX;

        const dy =
            originalY -
            currentY;


        const distance =
            Math.sqrt(
                dx*dx +
                dy*dy
            );


        if(distance < 25){

            placeArrow();

            return;

        }


        /*
          Consume one arrow
        */

        arrowsLeft--;

        arrowsText.textContent =
            arrowsLeft;


        /*
          Speed
        */

        const power =
            Math.min(
                distance / 17,
                18
            );


        velocityX =
            (dx / distance)
            * power;

        velocityY =
            (dy / distance)
            * power;


        flying = true;


        requestAnimationFrame(
            flyArrow
        );

    }
);


/* ==================================================
   FLY ARROW
================================================== */

function flyArrow(time){

    if(!flying)
        return;


    if(paused){

        lastTime =
            time;

        requestAnimationFrame(
            flyArrow
        );

        return;

    }


    if(!lastTime)
        lastTime =
            time;


    const dt =
        Math.min(
            (time - lastTime) / 16.67,
            2
        );


    lastTime =
        time;


    arrowX +=
        velocityX * dt;

    arrowY +=
        velocityY * dt;


    /*
      Gravity
    */

    velocityY +=
        .38 * dt;


    /*
      Arrow angle
    */

    const angle =
        Math.atan2(
            velocityY,
            velocityX
        );


    arrow.style.left =
        arrowX + "px";

    arrow.style.top =
        arrowY + "px";

    arrow.style.transform =
        `rotate(${angle}rad)`;


    /*
      Target collision
    */

    const targetRect =
        target.getBoundingClientRect();


    const arrowRect =
        arrow.getBoundingClientRect();


    const tipX =
        arrowRect.left +
        arrowRect.width -
        4;


    const tipY =
        arrowRect.top +
        arrowRect.height / 2;


    const centerX =
        targetRect.left +
        targetRect.width / 2;


    const centerY =
        targetRect.top +
        targetRect.height / 2;


    const distance =
        Math.sqrt(

            Math.pow(
                tipX -
                centerX,
                2
            )

            +

            Math.pow(
                tipY -
                centerY,
                2
            )

        );


    /*
      Hit target
    */

    if(
        distance <=
        targetRect.width / 2
    ){

        arrowHit(
            tipX,
            tipY
        );

        return;

    }


    /*
      Miss
    */

    if(

        arrowX >
        window.innerWidth + 250

        ||

        arrowX <
        -300

        ||

        arrowY >
        window.innerHeight + 250

        ||

        arrowY <
        -300

    ){

        arrowMiss();

        return;

    }


    requestAnimationFrame(
        flyArrow
    );

}


/* ==================================================
   CALCULATE POINTS
================================================== */

function getPoints(
    hitX,
    hitY
){

    const rect =
        target.getBoundingClientRect();


    const cx =
        rect.left +
        rect.width / 2;


    const cy =
        rect.top +
        rect.height / 2;


    const dx =
        hitX - cx;


    const dy =
        hitY - cy;


    const distance =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    const ratio =
        distance /
        (rect.width / 2);


    if(ratio <= .16)
        return 10;

    if(ratio <= .31)
        return 5;

    if(ratio <= .46)
        return 4;

    if(ratio <= .62)
        return 3;

    if(ratio <= .80)
        return 2;

    return 1;

}


/* ==================================================
   HIT
================================================== */

function arrowHit(
    x,
    y
){

    flying = false;


    const points =
        getPoints(
            x,
            y
        );


    score +=
        points;


    scoreText.textContent =
        score;


    /*
      Hit effect
    */

    hit.style.left =
        x + "px";

    hit.style.top =
        y + "px";


    hit.classList.remove(
        "active"
    );


    void hit.offsetWidth;


    hit.classList.add(
        "active"
    );


    /*
      Score popup
    */

    scorePop.textContent =
        "+" + points;


    scorePop.style.left =
        x + "px";

    scorePop.style.top =
        y + "px";


    scorePop.classList.remove(
        "show"
    );


    void scorePop.offsetWidth;


    scorePop.classList.add(
        "show"
    );


    /*
      Arrow stays stuck
    */

    arrow.style.left =
        arrowX + "px";

    arrow.style.top =
        arrowY + "px";


    /*
      Next arrow
    */

    setTimeout(
        nextShot,
        650
    );

}


/* ==================================================
   MISS
================================================== */

function arrowMiss(){

    flying = false;


    scorePop.textContent =
        "MISS";


    scorePop.style.left =
        arrowX + "px";

    scorePop.style.top =
        arrowY + "px";


    scorePop.classList.remove(
        "show"
    );


    void scorePop.offsetWidth;


    scorePop.classList.add(
        "show"
    );


    setTimeout(
        nextShot,
        500
    );

}


/* ==================================================
   NEXT SHOT
================================================== */

function nextShot(){

    if(
        arrowsLeft <= 0
    ){

        showGameOver();

        return;

    }


    placeArrow();

}


/* ==================================================
   GAME OVER
================================================== */

function showGameOver(){

    finalScore.textContent =
        score;


    gameOver.style.display =
        "flex";

}


/* ==================================================
   RESTART
================================================== */

playAgain.addEventListener(
    "click",
    () => {

        arrowsLeft = 10;

        score = 0;

        flying = false;

        paused = false;

        scoreText.textContent =
            "0";

        arrowsText.textContent =
            "10";


        gameOver.style.display =
            "none";


        pauseScreen.style.display =
            "none";


        placeArrow();

    }
);


/* ==================================================
   PAUSE
================================================== */

pauseBtn.addEventListener(
    "click",
    () => {

        if(
            gameOver.style.display ===
            "flex"
        )
            return;


        paused = true;


        pauseScreen.style.display =
            "flex";

    }
);


/* ==================================================
   RESUME
================================================== */

resumeBtn.addEventListener(
    "click",
    () => {

        paused = false;

        pauseScreen.style.display =
            "none";

        lastTime = 0;

    }
);


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(
    "resize",
    () => {

        if(
            !flying &&
            !dragging
        ){

            placeArrow();

        }

    }
);


/* ==================================================
   SERVICE WORKER
================================================== */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "./sw.js"
                )
                .catch(
                    error =>
                    console.log(
                        "SW Error:",
                        error
                    )
                );

        }
    );

}

</script>
